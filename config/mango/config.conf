### Cursor & Environment ###
cursor_theme=Bibata-Modern-Amber
cursor_size=24
env=XCURSOR_SIZE,24

### Window effect ###
blur=0
blur_layer=0
blur_optimized=0
blur_params_num_passes=2
blur_params_radius=6
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.15

shadows=0
layer_shadows=0
shadow_only_floating=0
shadows_size=10
shadows_blur=15
shadows_position_x=0
shadows_position_y=0
shadowscolor=0x000000aa

border_radius=4
no_radius_when_single=1
focused_opacity=1.0
unfocused_opacity=0.93

animations=1
layer_animations=1
animation_type_open=zoom      # zoom still feels modern/fast
animation_type_close=slide    # slide exit is quick & directional
animation_fade_in=1
animation_fade_out=1
fadein_begin_opacity=0.5      # slightly higher start → less "flash"
fadeout_begin_opacity=0.5
animation_duration_open=200
animation_duration_close=100
animation_duration_move=220
animation_duration_tag=140
animation_duration_focus=100
# Curves tuned for quicker feel (more aggressive start, controlled settle)
# Open: tiny overshoot but faster acceleration
animation_curve_open=0.4,0.0,0.2,1.0
animation_curve_close=0.4,0,0.2,1.0
animation_curve_move=0.2,0.8,0.4,1.0
animation_curve_tag=0.3,0.0,0.3,1.0
animation_curve_focus=0.4,0.0,0.6,1.0
animation_curve_opafadein=0.3,0.0,0.7,1.0
animation_curve_opafadeout=0.3,0.0,0.7,1.0
# Optional: if you want even more "snappy" tag switches
# tag_animation_direction=0  # horizontal (0) often feels faster perceptually

### Scroller Layout Setting ###
scroller_structs=10
scroller_default_proportion=0.95
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

### Master-Stack Layout Setting ###
new_is_master=1
default_mfact=0.55
default_nmaster=1
smartgaps=1
center_when_single_stack=1

### Overview Setting ###
hotarea_size=10
enable_hotarea=1
ov_tab_mode=0
overviewgappi=5
overviewgappo=30

### Misc ###
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1

focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=24
drag_tile_to_tile=1

### Input ###
repeat_rate=25
repeat_delay=350
numlockon=1
xkb_rules_layout=us,latam
xkb_rules_variant=,
xkb_rules_options=grp:alt_space_toggle
sloppyfocus=1
warpcursor=1
tap_to_click=1
disable_while_typing=1

### Trackpad ###
# need relogin to make it apply
disable_trackpad=0
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=1

left_handed=0
middle_button_emulation=1
swipe_min_threshold=1

### Mouse ###
# need relogin to make it apply
mouse_natural_scrolling=0

### Appearance ###
gappih=4
gappiv=4
gappoh=8
gappov=8
borderpx=4
scratchpad_width_ratio=0.9
scratchpad_height_ratio=0.9

### Nord ###
rootcolor=0x2e3440ff
bordercolor=0x4c566aff
focuscolor=0x5e81acff
urgentcolor=0xbf616aff
globalcolor=0x88c0d0ff
scratchpadcolor=0x3b4252ff
overlaycolor=0x5e81acff
maximizescreencolor=0x88c0d0ff

### Layer Rule ###
layerrule=animation_type_open:zoom,layer_name:rofi
layerrule=animation_type_close:zoom,layer_name:rofi
layerrule=animation_duration_open:40,layer_name:rofi
layerrule=animation_duration_close:30,layer_name:rofi
layerrule=layer_name:rofi,animation_type_open:zoom,animation_type_close:fade,

### Sources ###
source=~/.config/mango/env.conf
source=~/.config/mango/bind.conf
source=~/.config/mango/tag.conf
source=~/.config/mango/rule.conf


### AutoStart servers
exec-once = swayosd-server
