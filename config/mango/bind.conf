# ScratchPad
# Send current window to scratchpad (hides it)
bind=SUPER+SHIFT,s,minimized
# Toggle / Show the scratchpad (Sway-like cycle)
bind=SUPER,s,toggle_scratchpad
# Restore / Bring back the window from the scratchpad pile
bind=SUPER+CTRL,s,restore_minimized


# ScreenShot using hyprshot
bind=None,Print,spawn,hyprshot -m region -o ~/Pictures/Screenshots/ -f "Screenshot from $(date +'%Y-%m-%d %H-%M-%S.%3N').png"
bind=SUPER,Print,spawn,hyprshot -m output -o ~/Pictures/Screenshots/ -f "Screenshot from $(date +'%Y-%m-%d %H-%M-%S.%3N').png"


# Brightness Control for the keyboard Aukey KM-G6
bind=ALT,UP,spawn,swayosd-client --brightness raise
bind=ALT,DOWN,spawn,swayosd-client --brightness lower
