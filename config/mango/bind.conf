# monitor switch
bind=alt+shift,Left,focusmon,left
bind=alt+shift,Right,focusmon,right
bind=alt+shift,Up,focusmon,up
bind=alt+shift,Down,focusmon,down
bind=SUPER+Alt,Left,tagmon,left
bind=SUPER+Alt,Right,tagmon,right
bind=SUPER+Alt,Up,tagmon,up
bind=SUPER+Alt,Down,tagmon,down

# gaps
bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,R,togglegaps


# Mouse Button Bindings
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=alt,btn_middle,set_proportion,0.5
mousebind=SUPER,btn_right,moveresize,curresize
mousebind=SUPER+CTRL,btn_left,minimized
mousebind=SUPER+CTRL,btn_right,killclient
mousebind=SUPER+CTRL,btn_middle,togglefullscreen
# mousebind=NONE,btn_middle,togglemaximizescreen,0

# Axis Bindings (Mouse Scroll Wheel)
axisbind=SUPER,DOWN,focusdir,left
axisbind=SUPER,UP,focusdir,right
axisbind=SUPER+SHIFT,DOWN,viewtoleft_have_client
axisbind=SUPER+SHIFT,UP,viewtoright_have_client
axisbind=SHIFT+SUPER,DOWN,exchange_client,left
axisbind=SHIFT+SUPER,UP,exchange_client,right

# Gesturebind
# gesturebind=none,left,3,focusdir,left
# gesturebind=none,right,3,focusdir,right
# gesturebind=none,up,3,focusdir,up
# gesturebind=none,down,3,focusdir,down
gesturebind=none,right,3,viewtoleft,0
gesturebind=none,left,3,viewtoright,0
gesturebind=none,up,3,toggleoverview,1
gesturebind=none,down,3,toggleoverview,1

# brightness and volume
bind=NONE,XF86AudioRaiseVolume,spawn,~/.config/mango/scripts/volume.sh raise
bind=NONE,XF86AudioLowerVolume,spawn,~/.config/mango/scripts/volume.sh lower
bind=NONE,XF86AudioMute,spawn,swayosd-client --output-volume mute-toggle
bind=NONE,XF86MonBrightnessUp,spawn,swayosd-client --brightness raise
bind=NONE,XF86MonBrightnessDown,spawn,swayosd-client --brightness lower

#custom app bind
bind=SUPER,b,spawn, /home/ahmad/.tarball-installations/zen/zen
bind=SUPER+SHIFT,a,spawn,nemo
bind=SUPER+SHIFT,o,spawn,/home/ahmad/Downloads/AppImages/Obsidian-1.12.7.AppImage --no-sandbox
bind=SUPER,e,spawn,emacs
bind=CTRL+ALT,s,spawn,bash ~/.config/mango/scripts/hide_waybar_mango.sh
bind=SUPER,Escape,spawn,hyprlock
bind=CTRL+ALT,backslash,spawn,swaync-client -t
bind=CTRL+ALT,BackSpace,spawn,swaync-client -C
bind=SUPER,p,spawn,bash ~/.config/mango/scripts/monitor.sh
bind=SUPER+SHIFT,p,spawn,bash ~/.config/mango/scripts/virmon.sh
bind=SUPER,t,spawn,flatpak run io.missioncenter.MissionCenter

# namescrtachpad
