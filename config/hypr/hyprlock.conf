# No sourcing, no external dependencies

general {
    no_fade_in = false
    grace = 0
    disable_loading = true
}

background {
    monitor =
    # IMPORTANT: Ensure this file actually exists. 
    # If it doesn't, change this to a solid color like: color = rgb(20, 20, 20)
    path = screenshot
    
    blur_size = 4
    blur_passes = 3
    noise = 0.0117
    contrast = 1.3000
    brightness = 0.8000
}

# Hours
label {
    monitor =
    text = $TIME   # Uses native Hyprlock time (HH:MM)
    color = rgb(255, 255, 255)
    font_size = 120
    font_family = Geist Mono
    position = 0, 150
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:18000000] echo "<b>$(date +'%A, %d %b')</b>"
    color = rgb(200, 200, 200)
    font_size = 24
    font_family = Rubik
    position = 0, 20
    halign = center
    valign = center
}

# Weather (The only external command left)
label {
    monitor =
    text = cmd[update:18000000] echo "Feels like $(curl -s 'wttr.in?format=%t' | tr -d '+')"
    color = rgb(200, 200, 200)
    font_size = 18
    font_family = Sans
    position = 0, 50
    halign = center
    valign = bottom
}

# Password Input
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    
    outer_color = rgb(151, 151, 151)
    inner_color = rgb(200, 200, 200)
    font_color = rgb(10, 10, 10)
    
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    hide_input = false
    
    position = 0, 120
    halign = center
    valign = bottom
}
