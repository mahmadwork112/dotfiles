# No sourcing, no external dependencies

general {
    no_fade_in = false
    grace = 0
    disable_loading = true
}

background {
    monitor =
    # IMPORTANT: Ensure this file actually exists. 
    # If it doesn't, change this to a solid color like: color = rgb(20, 20, 20)
    path = screenshot
    
    blur_size = 4
    blur_passes = 3
    noise = 0.0117
    contrast = 1.3000
    brightness = 0.8000
}

# Hours
label {
    monitor =
    text = $TIME   # Uses native Hyprlock time (HH:MM)
    color = rgb(255, 255, 255)
    font_size = 120
    font_family = Geist Mono
    position = 0, 150
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:18000000] echo "<b>$(date +'%A, %d %b')</b>"
    color = rgb(200, 200, 200)
    font_size = 24
    font_family = Rubik
    position = 0, 20
    halign = center
    valign = center
}

# Weather
label {
    monitor =
    text = cmd[update:18000000] echo "Feels like $(curl -s 'wttr.in?format=%t' | tr -d '+')"
    color = rgb(200, 200, 200)
    font_size = 18
    font_family = Sans
    position = 0, 50
    halign = center
    valign = bottom
}

# Password Input
input-field {
    monitor =
    size = 250, 40
    outline_thickness = 0
    dots_size = 0.3
    dots_spacing = 0.25
    dots_center = true

    inner_color = rgba(0, 0, 0, 0)
    font_color = rgb(200, 200, 200)
    check_color = rgb(100, 200, 100)
    fail_color = rgb(220, 80, 80)

    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text = <i>Password or scan finger</i>
    hide_input = false

    position = 0, 140
    halign = center
    valign = bottom
}

# Underline accent
shape {
    monitor =
    size = 250, 2
    color = rgb(151, 151, 151)
    position = 0, 138
    halign = center
    valign = bottom
}

auth {
  fingerprint{
      enabled = true
      ready_message = (Scan fingerprint to unlock)
      present_message = Scanning fingerprint...
      retry_delay = 200
    }
}
